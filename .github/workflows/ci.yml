name: CI

on:
  push:
    branches:
      - develop
      - main
      - "release/**"
  pull_request:
    branches:
      - develop
      - main
      - "release/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      # 本地 lockfile 在 macOS + 阿里内网源生成：既指向内网 registry（公网访问不到），
      # 又缺 Linux 平台的 rollup optional 依赖（npm/cli#4828）。
      # CI 删除 lockfile，让 npm 在 Linux + 公共源全新解析。
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Run all checks (format + lint + stylelint + build)
        run: npm run check:all
