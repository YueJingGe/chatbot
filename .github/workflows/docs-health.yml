name: Docs Health Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docs-health:
    name: Docs Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Docs Health Check
        run: node scripts/docs-health-check.mjs
